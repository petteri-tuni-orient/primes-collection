<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName suhdekartta.sofa.ithou.fi
	ServerAlias suhdekartta.sofa.ithou.fi

	ServerAdmin webmaster@localhost

	DocumentRoot /var/www/sofa/suhdekartta

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/suhdekartta.sofa.ithou.fi.error.log
	CustomLog ${APACHE_LOG_DIR}/suhdekartta.sofa.ithou.fi.access.log combined

	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
	# include a line for only one particular virtual host. For example the
	# following line enables the CGI configuration for this host only
	# after it has been globally disabled with "a2disconf".
	#Include conf-available/serve-cgi-bin.conf

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/ilo.ithou.fi-0001/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/ilo.ithou.fi-0001/privkey.pem
</VirtualHost>
</IfModule>
<IfModule mod_ssl.c>
<VirtualHost *:80>
	ServerName suhdekartta.sofa.ithou.fi
	ServerAlias suhdekartta.sofa.ithou.fi

	ServerAdmin webmaster@localhost

	DocumentRoot /var/www/sofa/suhdekartta

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/suhdekartta.ithou.fi.error.log
	CustomLog ${APACHE_LOG_DIR}/suhdekartta.ithou.fi.access.log combined

	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
	# include a line for only one particular virtual host. For example the
	# following line enables the CGI configuration for this host only
	# after it has been globally disabled with "a2disconf".
	#Include conf-available/serve-cgi-bin.conf

       ProxyPass "/"  "http://localhost:8080/"
       ProxyPassReverse "/"  "http://localhost:8080/"

RewriteEngine on
# Some rewrite rules in this file were disabled on your HTTPS site,
# because they have the potential to create redirection loops.

# RewriteCond %{SERVER_NAME} =suhdekartta.sofa.ithou.fi
# RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

RewriteCond %{SERVER_NAME} =suhdekartta.sofa.ithou.fi
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
</IfModule>
